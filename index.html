<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171615">
<meta name="description" content="ЭТНОС — кофейня грузинской кухни в Астраханье">
<title>ЭТНОС — Кофейня</title>
<style>
:root{
  --bg:#151413;--card:#211f1d;--card2:#292622;--text:#f4efe6;--muted:#bdb4a8;
  --gold:#cdbfa8;--line:rgba(205,191,168,.24);--green:#6a9a70;--green2:#507a56;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:
  radial-gradient(circle at 50% -10%,#403a34 0,rgba(64,58,52,.5) 24%,transparent 50%),
  linear-gradient(180deg,#171615 0%,#0f0e0d 100%);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:radial-gradient(#fff 0.6px,transparent .6px);background-size:7px 7px;mask-image:linear-gradient(to bottom,black,transparent 70%);}
.wrap{width:min(100%,520px);margin:0 auto;padding:24px 16px 30px;position:relative}
.hero{text-align:center;padding:8px 4px 20px}
.logo{width:172px;height:172px;border-radius:50%;object-fit:cover;border:1px solid rgba(226,215,196,.65);box-shadow:0 18px 55px rgba(0,0,0,.45),0 0 0 8px rgba(205,191,168,.05);display:block;margin:0 auto 20px}
h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:31px;letter-spacing:.24em;font-weight:500;padding-left:.24em}
.sub{margin:8px 0 0;color:var(--muted);font-size:12px;letter-spacing:.36em;padding-left:.36em;text-transform:uppercase}
.divider{display:flex;align-items:center;gap:12px;margin:22px 12px 20px;color:var(--gold)}
.divider:before,.divider:after{content:"";height:1px;background:linear-gradient(90deg,transparent,var(--line));flex:1}
.divider:after{background:linear-gradient(90deg,var(--line),transparent)}
.diamond{width:10px;height:10px;border:1px solid var(--gold);transform:rotate(45deg);position:relative}
.diamond:after{content:"";position:absolute;inset:2px;border:1px solid rgba(205,191,168,.5)}
.links{display:grid;gap:11px}
.link{position:relative;min-height:68px;display:flex;align-items:center;gap:14px;padding:13px 15px;border-radius:19px;background:linear-gradient(135deg,rgba(43,40,37,.96),rgba(29,28,26,.96));border:1px solid var(--line);color:var(--text);text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:transform .18s ease,border-color .18s ease,background .18s ease}
.link:hover,.link:active{transform:translateY(-1px);border-color:rgba(205,191,168,.5);background:linear-gradient(135deg,#312d29,#22201e)}
.icon{width:43px;height:43px;flex:0 0 43px;border-radius:14px;display:grid;place-items:center;background:#312e2a;border:1px solid rgba(205,191,168,.16);color:var(--gold)}
.icon svg{width:24px;height:24px;display:block}
.icon.brand-instagram{background:linear-gradient(135deg,#f0d2a4 0%,#c56c76 48%,#5c4a82 100%);border:none;color:#fff}
.icon.brand-2gis{background:linear-gradient(135deg,#69a46d,#47794e);border:none;color:#fff;font-size:11px;font-weight:800;letter-spacing:-.03em}
.icon.brand-yandex{background:#efe8dd;color:#d54a3f;border:none}
.label{display:flex;flex-direction:column;gap:3px;min-width:0}
.title{font-size:16px;font-weight:700;letter-spacing:.01em}
.meta{font-size:12px;color:#a9a198;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{margin-left:auto;color:#8e877f;font-size:25px;line-height:1;font-weight:300}
.footer{text-align:center;color:#827b73;font-size:11px;line-height:1.6;margin:19px 12px 0}
.footer strong{color:#a9a095;font-weight:600}
.address{margin-top:12px;color:#a39b91;font-size:12px}
@media (max-width:380px){.logo{width:148px;height:148px}h1{font-size:27px}.link{min-height:64px}}
</style>

<style id="etnos-scroll-fix">
html, body {
  margin: 0 !important;
  padding: 0 !important;
  min-height: 100% !important;
  background: #171717 !important;
  overscroll-behavior: none;
}
body {
  overflow-x: hidden !important;
}
main, .page, .container, .content, .wrapper {
  background: transparent !important;
}
section:last-child {
  margin-bottom: 0 !important;
}
</style>
